# Self-hosted n8n for LendLoop.
#   cp n8n/.env.example n8n/.env                          # fill in values (secrets live only there)
#   docker compose --profile setup run --rm n8n-import    # one-time: import + publish the workflows
#   docker compose up -d n8n                              # editor at http://localhost:5678
#
# Secrets come from n8n/.env via env_file and are read by Code nodes as $env.*.
# They are never written into the exported workflow JSON.

x-n8n-common: &n8n-common
  image: docker.n8n.io/n8nio/n8n:2.49.5
  env_file: ./n8n/.env
  environment:
    # Code nodes need $env access (for the secrets above) and Node's crypto module (HMAC).
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    NODE_FUNCTION_ALLOW_BUILTIN: crypto
    # Privacy / housekeeping: execution data includes recipient emails, so keep it 7 days.
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: "168"
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  volumes:
    - n8n_data:/home/node/.n8n

services:
  n8n:
    <<: *n8n-common
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678" # loopback only; put a TLS reverse proxy in front when hosting
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets n8n reach a Convex backend running on the host

  # One-shot importer. Publishes the error handler first so the others can reference it.
  # Re-running overwrites edits made in the n8n UI with the versions in ./n8n/workflows.
  n8n-import:
    <<: *n8n-common
    profiles: ["setup"]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        n8n import:workflow --separate --input=/workflows &&
        n8n publish:workflow --id=LLerrorWorkflow1 &&
        n8n publish:workflow --id=LLrequestNotify1 &&
        n8n publish:workflow --id=LLoverdueRemind1

volumes:
  n8n_data:
